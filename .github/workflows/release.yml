# Signs the extension with Mozilla (unlisted), publishes the signed .xpi as a
# GitHub release, and points updates.json at it so installed copies update
# themselves. Triggered by pushing a tag like v0.6 that matches manifest.json.
#
# Needs two repo secrets (Settings > Secrets and variables > Actions):
#   AMO_JWT_ISSUER  - "JWT issuer" from addons.mozilla.org/developers/addon/api/key/
#   AMO_JWT_SECRET  - "JWT secret" from the same page
name: Sign and release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches manifest version
        id: meta
        run: |
          VERSION=$(jq -r .version manifest.json)
          ADDON_ID=$(jq -r .browser_specific_settings.gecko.id manifest.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "addon_id=$ADDON_ID" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets are set
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Add AMO_JWT_ISSUER and AMO_JWT_SECRET under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@8 lint --self-hosted --ignore-files README.md updates.json

      - name: Sign with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx --yes web-ext@8 sign
          --channel unlisted
          --source-dir .
          --artifacts-dir dist
          --ignore-files README.md updates.json
          --timeout 1800000
          --approval-timeout 1800000

      - name: Collect signed file
        id: xpi
        run: |
          SIGNED=$(ls dist/*.xpi | head -n 1)
          test -n "$SIGNED"
          FILE="yt_clean_feed-${{ steps.meta.outputs.version }}.xpi"
          mv "$SIGNED" "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.xpi.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --verify-tag \
              --title "YT Clean Feed ${TAG#v}" \
              --notes "Signed by Mozilla. To install in Firefox (desktop or Android), open the .xpi link below. Installed copies update automatically."
          fi

      - name: Point updates.json at this release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ADDON_ID: ${{ steps.meta.outputs.addon_id }}
          FILE: ${{ steps.xpi.outputs.file }}
          SHA256: ${{ steps.xpi.outputs.sha256 }}
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$FILE"
          git fetch origin main
          git checkout -B main origin/main
          jq --arg id "$ADDON_ID" --arg v "$VERSION" --arg u "$URL" --arg h "sha256:$SHA256" \
            '.addons[$id].updates = ([.addons[$id].updates[]? | select(.version != $v)] + [{version: $v, update_link: $u, update_hash: $h}])' \
            updates.json > updates.tmp && mv updates.tmp updates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "Release $VERSION: update updates.json"
          git push origin main
